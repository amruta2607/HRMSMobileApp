name: altroz
description: "ALTROZ HRMS Application"
publish_to: 'none'
version: 1.0.0+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  google_fonts: ^6.2.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  font_awesome_flutter: ^10.7.0
  http: ^1.1.0
  shared_preferences:
  image_picker: ^1.0.7





  overlay_support: ^2.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  open_file: ^3.3.2
  flutter_pdfview: ^1.3.2
  url_launcher: ^6.3.2
  flutter_file_dialog: ^3.0.1
  share_plus: ^10.0.0
  connectivity_plus: ^7.0.0
  flutter_widget_from_html: ^0.17.2
  image_cropper: ^12.2.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - img/


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "img/app_icon.png"

